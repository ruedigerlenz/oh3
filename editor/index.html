<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<title>oh3 - level editor</title>
	<link rel="stylesheet" href="styles/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
</head>

<body>
	<div id="app">
		<main>
			<section id="left">
				<canvas id="grid" width="640" height="480"></canvas>
				<div id="palette">
					<!-- palette populated by JS -->
				</div>
			</section>
			<section id="right">
				<header>
					<h1>Level Editor</h1>
					<div class="controls">
						<button id="prev-level" aria-label="Previous level">&lt;</button>
						<button id="next-level" aria-label="Next level">&gt;</button>
						<button id="export-current-level">Export Level</button>
						<button id="delete-level">Delete Level</button>
						<button id="new-level">New</button>
						<button id="play-level">Play Level</button>
						<button id="play-levels">Play All</button>
						<button id="import-levels">Import</button>
						<input id="file-input" type="file" accept=".json,application/json" hidden>
						<button id="append-levels">Append Levels</button>
						<input id="append-file-input" type="file" accept=".json,application/json" hidden>
						<button id="export-levels">Export All</button>
					</div>
				</header>
				<div class="level-list-panel">
					<h2>Levels</h2>
					<label class="level-name-control" for="level-set-name">
						Level set name:
						<input id="level-set-name" type="text" autocomplete="off">
					</label>
					<label class="level-name-control" for="level-name">
						Current level name:
						<input id="level-name" type="text" autocomplete="off">
					</label>
					<ol id="level-list" aria-label="Levels"></ol>
				</div>
			</section>
		</main>
	</div>
	<svg id="block-properties-connector" class="block-properties-connector" aria-hidden="true" hidden>
		<line id="block-properties-connector-line"></line>
		<circle id="block-properties-connector-target" r="5"></circle>
	</svg>
	<aside id="block-properties-panel" class="block-properties-panel" aria-labelledby="block-properties-title" hidden>
		<div class="block-properties-header" title="Drag to move">
			<h2 id="block-properties-title">Block properties</h2>
			<button id="close-block-properties" type="button" aria-label="Close block properties">×</button>
		</div>
		<div id="block-properties-content"></div>
	</aside>

	<script type="module" src="js/script.js"></script>
</body>

</html>
